<!--
  The Vecini mark: the house, its window and the two neighbours, traced from
  the logo artwork. The cream ground of the original is deliberately not here —
  the mark is drawn straight onto whatever is behind it, and the app icons put
  their own background back underneath.

  Source of truth. index.html carries an inline copy for the waiting screen, so
  that it paints without waiting for a request; tests/20-splash.spec.js checks
  the two have not drifted apart.
-->
