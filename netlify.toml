[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Everything under /assets/ has a content hash in its filename, so a given URL
# can never change what it holds — a new build is a new name. Saying so lets a
# phone that already has the file skip even asking about it. Without this it
# revalidates all of them on every open, which on mobile latency is a round
# trip per file before anything can run.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry point is the opposite case: same URL, new contents on every deploy,
# and it is what names the hashed files above. It must never be held on to, or
# a phone keeps loading the previous build's assets and no deploy ever arrives.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same reasoning: both are read fresh on every open, and a stale service worker
# outlives the deploy that replaced it.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
