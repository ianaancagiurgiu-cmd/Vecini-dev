  <meta name="theme-color" content="#faf7f0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!-- iOS ignores the manifest icon; it needs its own tag, and push only works
       once the app has been added to the home screen. -->
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Vecini" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Vecini — comunitatea ta de cartier</title>
  <!-- The mark on its own tile: at 16 px on a tab strip, a shape with no
       ground behind it is two smudges of colour. -->
  <link rel="icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    Loaded without blocking the first paint.

    A plain stylesheet here holds up rendering until it arrives — and it comes
    from a third-party host, so on mobile data that is a DNS lookup and a TLS
    handshake before anything of ours is allowed on screen. Measured: with the
    font request taking 800ms the waiting screen appeared at 832ms, and at
    2500ms it appeared at 2536ms. One for one. Which defeats the entire point
    of drawing that screen inline — it exists to be on screen in the first
    frame, and it was waiting on Google.

    media="print" is not applicable to a screen, so the browser fetches it at
    low priority and paints without it; onload promotes it to the real thing.
    The URL already asks for display=swap, so text shows immediately in
    Georgia and the real faces swap in when they land.
  -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" /></noscript>
  <!--
    The waiting screen lives here, in the document itself, rather than in a
    component. Everything React draws arrives after a 566 KB bundle has been
    fetched and parsed, which is exactly the wait this is meant to cover — a
    splash that loads with the app would appear at the end of the pause instead
    of during it. Inline markup, inline styles, no requests of any kind: it
    paints on the first frame and costs nothing.

    The arrangement is WhatsApp's, and Slack's and Teams': the mark alone in the
    middle of the screen, the name at the foot, and nothing that pretends to
    know how far along the loading is. No "from" in front of the name — WhatsApp
    can say "from Meta" because Meta is somebody else; here the app and the name
    are the same thing. The mark is the same drawing
    as public/logo.svg, copied in rather than linked so that it needs no request
    — tests/20-splash.spec.js checks the two have not drifted apart.

    It sits outside #root so React never clears it. App.jsx takes it away once
    there is a real screen behind it, which is later than you would think —
    signing in, resolving membership and loading the community are three more
    blank moments after the bundle arrives.
  -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: #faf7f0;
      transition: opacity .45s ease;
    }
    #splash.is-done { opacity: 0; pointer-events: none; }

    #splash .mark { width: 108px; height: auto; display: block; }

    /* Down at the foot, out of the way of the mark, where every one of the
       three apps she pointed at puts it. */
    #splash .by {
      position: absolute; left: 0; right: 0;
      bottom: calc(46px + env(safe-area-inset-bottom, 0px));
      text-align: center; line-height: 1.25;
    }
    #splash .by-name {
      display: block;
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-style: italic; font-size: 27px; color: #2f6b4f; letter-spacing: .01em;
    }

    /*
      Barely an animation: it starts most of the way there, so the mark is on
      screen from the first frame and only settles into place. Anything that
      fades up from nothing would give back the blank moment this exists to
      cover.
    */
    #splash .mark, #splash .by { animation: sp-in .55s cubic-bezier(.2, .7, .3, 1) both; }
    #splash .by { animation-delay: .1s; }
    @keyframes sp-in {
      from { opacity: .35; transform: translateY(4px) scale(.98); }
      to   { opacity: 1;   transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .mark, #splash .by { animation: none; }
    }
  </style>
</head>
